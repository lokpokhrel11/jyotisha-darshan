name: Calculator regression checks

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/calculator-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/calculator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run chapter 4–6 calculator boundary tests
        run: node tests/calculator-boundaries.test.js
      - name: Run chapter 6 cycle regression tests
        run: node tests/chapter6-cycles.test.js
      - name: Validate Chapter 7 assessment
        run: node tests/chapter7-assessment.test.js
      - name: Validate Chapter 8 house counting
        run: node tests/chapter8-house-counting.test.js
      - name: Validate Chapter 9 sign and Moon-house calculations
        run: node tests/chapter9-position.test.js
      - name: Validate Chapter 9 assessment
        run: node tests/chapter9-assessment.test.js
      - name: Validate Chapter 10 calculations and assessment
        run: node tests/chapter10-assessment.test.js
