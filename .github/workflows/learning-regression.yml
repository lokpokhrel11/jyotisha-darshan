name: Learning experience regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/learning-regression.yml'
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/learning.spec.mjs --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
