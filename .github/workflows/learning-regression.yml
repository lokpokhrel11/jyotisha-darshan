name: Learning experience regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/learning-regression.yml'
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local website\n        run: |\n          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jyotisha-http.log 2>&1 &\n          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html > /dev/null && break; sleep 1; done\n      - name: Run browser regression against current commit\n        env:\n          TEST_BASE_URL: http://127.0.0.1:8765/index.html\n        run: npx playwright test tests/learning.spec.mjs --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
