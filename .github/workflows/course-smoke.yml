name: Course source smoke tests
on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'tests/site-smoke.cjs'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/course-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'tests/site-smoke.cjs'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/course-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate course structure
        run: node tests/site-smoke.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run Chromium browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jyotisha-http.log 2>&1 &
          node tests/browser-smoke.cjs
